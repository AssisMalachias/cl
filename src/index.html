<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone Disneyplus</title>
    <link rel="stylesheet" href="../dist/css/main.css"/>
</head>
<body>
    <main>
      <section class="hero">
        <div class="hero__container">
          <h1 class="hero__container--branding">
             <img src="../src/image/disneyplus.svg" alt="Disnep+">
          </h1>
          <h3 class="titulo">
            As melhores histórias em um só lugar.
          </h3>
          <p>
            <a href="http://" class="text--media">Assinar o Disney+</a><br>
            <span class="text--other">R$27,90/mês o R$279,90/ano à vista*</span>
          </p>
          <ul class="hero__container__combos">
            <li class="hero__container__combos--combo">
              <img src="../src/image/logos/disney_star_plus.png" alt="Disney Star Plus">
              <button type="button" class="titulo--media">ASSINE AGORA</button>
              <span class="text--small">R$ 45,90/mês*</span>
            </li>
             <li class="hero__container__combos--combo">
              <img src="../src/image/logos/disney_star_plus_starzplay.png" alt="Disney Starz Play Plus">
              <button type="button" class="titulo--media">ASSINE AGORA</button>
              <span class="text--small">R$ 55,90/mês*</span> 
            </li>
          </ul>
          <p class="text--small">
            *O preço pode variar caso a assinaturar seja feita através da outras plataformas*
          </p>
        </div>
      </section><!-- hero -->
    </main>

  <script src="../dist/js/main.js"></script>
</body>
</html>
